<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Warm ivory background -->
  <rect width="320" height="180" fill="#FAF6F0"/>

  <!-- Icon: Vintage desk calendar (centered, 80x80 area) -->
  <g transform="translate(120, 10)" fill="none" stroke="#4A3728" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Calendar base -->
    <path d="M10,60 L10,15 Q0,10 10,10 H70 Q80,10 80,20 L80,60 Z" fill="none"/>
    <!-- Top binding/spine -->
    <path d="M20,10 L20,5 M60,10 L60,5" stroke-width="1.2"/>
    <!-- Ring holes -->
    <circle cx="20" cy="15" r="3" fill="#FAF6F0"/>
    <circle cx="60" cy="15" r="3" fill="#FAF6F0"/>
    <!-- Ring binders (slight angle perspective) -->
    <path d="M17,15 Q14,17 17,20" stroke-width="1.2"/>
    <path d="M63,15 Q66,17 63,20" stroke-width="1.2"/>
    <!-- Page lines (subtle paper detail) -->
    <path d="M18,30 L72,30" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.5"/>
    <path d="M18,40 L72,40" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.5"/>
    <path d="M18,50 L72,50" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.5"/>
    <!-- Folded corner on top page -->
    <path d="M65,25 L75,25 L65,35 Z" fill="#FAF6F0" stroke="#4A3728" stroke-width="1.2"/>
    <!-- Base shadow line (grounding) -->
    <path d="M12,62 L78,62" stroke-width="1.4" opacity="0.25"/>
  </g>

  <!-- Wordmark: CAMPUSFLOW -->
  <text x="160" y="130" text-anchor="middle"
        font-family="'Playfair Display', 'Georgia', serif"
        font-size="38"
        font-weight="500"
        letter-spacing="0.12em"
        fill="#4A3728">
    CAMPUSFLOW
  </text>

  <!-- Fallback text rendering for environments without Playfair Display -->
  <style type="text/css"><![CDATA[
    @font-face {
      font-family: 'Playfair Display';
      src: url('https://fonts.gstatic.com/s/playfairdisplay/v30/nuFvD-vYSZviVYUb_rj3ij__anPXJzDwcbmjWBN2PKdFvXDXbtXsAQ.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
  ]]></style>
</svg>