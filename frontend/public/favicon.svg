<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Warm ivory background -->
  <rect width="64" height="64" fill="#FAF6F0" rx="8"/>

  <!-- Simplified calendar icon for favicon -->
  <g transform="translate(8, 6)" fill="none" stroke="#4A3728" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Calendar base -->
    <path d="M6,42 L6,12 Q0,8 6,8 H42 Q48,8 48,16 L48,42 Z"/>
    <!-- Ring binders -->
    <circle cx="14" cy="16" r="4" fill="#FAF6F0"/>
    <circle cx="40" cy="16" r="4" fill="#FAF6F0"/>
    <!-- Page line -->
    <path d="M14,28 L38,28" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.5"/>
    <path d="M14,34 L38,34" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.5"/>
  </g>
</svg>